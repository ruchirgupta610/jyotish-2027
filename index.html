<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2027 Vedic Planetary Transits & Kundli Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #060911;
      --bg-card: #0c1220;
      --bg-surface: #151e30;
      --gold-line: #d4af37;
      --gold-dim: rgba(212, 175, 55, 0.22);
      --accent-blue: #38bdf8;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --border-card: #1c273c;
      --border-light: #2d3b55;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.5;
      min-height: 100vh;
      padding: 14px 20px;
    }

    .app-container {
      max-width: 1640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top Navigation Header */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-om {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111;
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand h1 {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      letter-spacing: 1px;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-accent {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 2px 7px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #f59e0b;
      border-radius: 4px;
      color: #fbbf24;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .active-date-badge {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      color: #fbbf24;
      background: var(--bg-surface);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-light);
    }

    /* Top Active Event Meta Banner */
    .active-banner {
      background: var(--bg-card);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
    }

    .banner-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      margin-bottom: 3px;
    }

    .active-date {
      color: #fbbf24;
      font-weight: 600;
    }

    .active-index {
      color: var(--text-muted);
    }

    .active-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      color: var(--text-primary);
      margin-bottom: 3px;
    }

    .active-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .yogas-container {
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border-card);
      padding-top: 8px;
    }

    .tag-title {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .yoga-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .yoga-badge {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-line);
      color: #fbbf24;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* Workspace Grid: 40% Left, 60% Right */
    .workspace-grid {
      display: grid;
      grid-template-columns: 4fr 6fr;
      gap: 18px;
      align-items: stretch;
    }

    @media (max-width: 1140px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left Section: Chart Card */
    .chart-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chart-card {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-card);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chart-tag {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f59e0b;
    }

    .legend-pills {
      display: flex;
      gap: 12px;
      font-size: 0.74rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .legend-pill {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .motion-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .retro-dot { background: var(--accent-red); }
    .direct-dot { background: var(--accent-blue); }

    .svg-stage-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 580px;
      margin: 0 auto;
      background: radial-gradient(circle at center, #111a2d, #060911);
      border-radius: 8px;
      border: 1px solid var(--gold-dim);
      padding: 10px;
      position: relative;
      overflow: hidden;
    }

    /* Orkut-Style CSS Ripple Overlay */
    .ripple-overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .orkut-wave {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: orkutRippleWave 1.6s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }

    @keyframes orkutRippleWave {
      0% {
        width: 30px;
        height: 30px;
        opacity: 0.95;
        border-width: 5px;
      }
      50% {
        opacity: 0.7;
      }
      100% {
        width: 440px;
        height: 440px;
        opacity: 0;
        border-width: 1px;
      }
    }

    .kundli-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Chart Controls Directly Below */
    .chart-controls-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .rashi-control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .styled-select {
      background: #090e1a;
      color: #fbbf24;
      border: 1px solid var(--gold-line);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .styled-select:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
    }

    .playback-controls-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #1c273c;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #273752;
      border-color: var(--gold-line);
    }

    .btn-primary {
      background: #d97706;
      border-color: #f59e0b;
      color: #111;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: #f59e0b;
    }

    .btn-icon {
      padding: 7px 12px;
    }

    /* Prediction Card */
    .prediction-card {
      background: var(--bg-surface);
      border-radius: 8px;
      padding: 14px 18px;
      border-left: 4px solid var(--gold-line);
    }

    .prediction-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .rashi-indicator {
      font-weight: 700;
      color: #fbbf24;
      font-size: 0.88rem;
    }

    .prediction-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .prediction-text {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    /* Right Section: Live Planetary Status Table */
    .table-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-table-card {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-card);
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .status-table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .table-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-card);
      background: #090e1a;
    }

    .graha-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.82rem;
      table-layout: fixed;
    }

    .graha-table th {
      background: #111a2d;
      color: var(--text-muted);
      padding: 9px 10px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-card);
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .graha-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #141f33;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .graha-row {
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .graha-row:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .graha-row-highlight {
      background: rgba(245, 158, 11, 0.22) !important;
      box-shadow: inset 4px 0 0 #f59e0b;
      font-weight: 600;
    }

    .graha-row-highlight td {
      color: #fff !important;
    }

    .badge-status {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-uchha-tbl { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }
    .badge-neecha-tbl { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #dc2626; }
    .badge-swakshetra-tbl { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #0284c7; }
    .badge-combust-tbl { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #d97706; }
    .badge-retro-tbl { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #dc2626; }
    .badge-direct-tbl { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #2563eb; }
    .badge-grahan-tbl { background: rgba(220, 38, 38, 0.25); color: #f87171; border: 1px solid #b91c1c; }

    /* SVG Elements */
    .rashi-label-text {
      fill: #64748b;
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 600;
      user-select: none;
    }

    .graha-group {
      cursor: pointer;
    }

    .graha-circle {
      stroke-width: 2.2;
      transition: opacity 0.75s ease, filter 0.75s ease;
    }

    .graha-text {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight
